name: server

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

defaults:
  run:
    working-directory: server

env:
  CARGO_TERM_COLOR: always
  SUISEI_DICT_CACHE: ${{ github.workspace }}/.cache/suisei-dict

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml のバージョンを入れる
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # 形態素解析の辞書のソース。版を変えるまで取得し直さない
      - uses: actions/cache@v4
        with:
          path: ${{ env.SUISEI_DICT_CACHE }}
          key: suisei-dict-${{ hashFiles('server/dict/build.rs') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
