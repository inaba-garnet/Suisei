name: release

# タグ（v0.1.0 など）を push したら、イメージを GHCR に載せ、Release を作る（docs/server.md の「Docker イメージ」）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 0.1.0、0.1、latest を付ける。リリース候補（0.2.0-rc.1）には 0.2 と latest を付けない
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/suisei
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # イメージの Debian のパッケージの一覧と、ffmpeg（GPL）のソースを Release に添える。
      # ほかの GPL のパッケージは、一覧の版で Debian のアーカイブから入手できる
      - name: Collect sources
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/suisei@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release/ffmpeg-source
          docker run --rm --user root --entrypoint dpkg-query "$IMAGE" \
            -W -f '${Package}\t${Version}\t${source:Package}\t${source:Version}\n' > release/debian-packages.tsv
          version=$(awk -F'\t' '$1 == "ffmpeg" { print $4 }' release/debian-packages.tsv)
          docker run --rm --user root --entrypoint sh -v "$PWD/release/ffmpeg-source:/out" -w /out "$IMAGE" -c "
            sed -i 's/^Types: deb\$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources &&
            apt-get update -qq &&
            apt-get source --download-only -o APT::Sandbox::User=root ffmpeg=$version"
          ls -l release release/ffmpeg-source
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # v0.2.0-rc.1 のようなリリース候補はプレリリースにし、「Latest」の Release にしない
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" --generate-notes release/debian-packages.tsv release/ffmpeg-source/*
