# 本番の例（docs/server.md の「Docker イメージ」）。
# 同じディレクトリの .env に SUISEI_USER と SUISEI_PASSWORD を書き、`docker compose up -d --build` で起動する。
services:
  suisei:
    build: .
    restart: unless-stopped
    ports:
      - "4533:4533"
    # /data に書き込める uid:gid に合わせる（既定は 1000:1000）
    # user: "1000:1000"
    environment:
      # ログインの利用者名とパスワード（必須）
      SUISEI_USER: ${SUISEI_USER:?}
      SUISEI_PASSWORD: ${SUISEI_PASSWORD:?}
      # OpenSubsonic の apiKey 認証を受け付けるときだけ設定する
      # SUISEI_API_KEY: ${SUISEI_API_KEY}
      # 定期スキャンの間隔（既定は 1h、0 で起動時だけ）
      # SUISEI_SCAN_INTERVAL: 1h
      # リバースプロキシの後ろに置くときだけ付ける。認証の制限で送り主の IP を X-Forwarded-For から取る
      # SUISEI_TRUST_FORWARDED_FOR: "true"
      # `キャラクター(CV:声優)` を分けない
      # SUISEI_SPLIT_CHARACTERS: "false"
    volumes:
      # DB とキャッシュ（SUISEI_DATA_DIR）
      - ./data:/data
      # 音楽フォルダ（SUISEI_MUSIC_DIR）。読み取りだけでマウントする
      - /path/to/music:/music:ro
