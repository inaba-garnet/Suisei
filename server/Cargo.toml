[package]
name = "suisei"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8.42"
form_urlencoded = "1"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.3"
hex = "0.4"
humantime = "2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lofty = "0.25"
md-5 = "0.10"
mime = "0.3"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
suisei-dict = { path = "dict" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
walkdir = "2"
wana_kana = "5"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.23"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# 辞書を作る build.rs は数十万語を処理するので、最適化しないと遅い
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
